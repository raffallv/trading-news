name: Finviz Momentum Screen

# Disabled by request 2026-08-13 — Dashboard Match covers this now, kept
# separate. Manual runs still work if this needs to come back; just
# uncomment the schedule block below.
on:
  # schedule:
  #   - cron: "*/15 8-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: finviz-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Scan Finviz Elite momentum screen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINVIZ_AUTH_TOKEN: ${{ secrets.FINVIZ_AUTH_TOKEN }}
        run: python catalyst_news.py finviz

      - name: Save seen-tickers cache
        run: |
          git config user.name "catalyst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_finviz.json || true
          git diff --cached --quiet || git commit -m "update finviz seen cache [skip ci]"
          git pull --rebase origin main || true
          git push || true
