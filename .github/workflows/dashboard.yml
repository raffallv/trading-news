name: Momentum Dashboard

on:
  schedule:
    - cron: "*/5 8-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Update dashboard + alert on new matches
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINVIZ_AUTH_TOKEN: ${{ secrets.FINVIZ_AUTH_TOKEN }}
        run: python catalyst_news.py dashboard

      - name: Commit dashboard + seen cache
        run: |
          git config user.name "catalyst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/dashboard.html seen_dashboard.json || true
          git diff --cached --quiet || git commit -m "update dashboard [skip ci]"
          git pull --rebase origin main || true
          git push || true
