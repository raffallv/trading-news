name: Breaking News Scan

on:
  schedule:
    - cron: "*/15 8-23 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: breaking-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Scan for breaking catalysts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python catalyst_news.py scan

      - name: Save seen-headlines cache
        run: |
          git config user.name "catalyst-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_news.json || true
          git diff --cached --quiet || git commit -m "update seen cache [skip ci]"
          git pull --rebase origin main || true
          git push || true
